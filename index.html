<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>班級點餐系統-密碼保護版</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root { --primary: #007bff; --success: #28a745; --danger: #dc3545; --bg: #f4f7f9; }
        * { touch-action: manipulation; box-sizing: border-box; }
        body { font-family: -apple-system, system-ui, sans-serif; background-color: var(--bg); margin: 0; padding: 15px; color: #333; }
        .container { width: 100%; max-width: 600px; margin: 0 auto; }
        .card { background: white; padding: 20px; border-radius: 20px; box-shadow: 0 8px 24px rgba(0,0,0,0.08); margin-bottom: 20px; }
        .info-box { text-align: center; background: #e9ecef; padding: 12px; border-radius: 15px; margin-bottom: 20px; border: 1px solid #dee2e6; }
        .day-label { font-weight: bold; color: #666; font-size: 14px; }
        select { width: 100%; padding: 15px; border: 2px solid #edf2f7; border-radius: 12px; font-size: 16px; margin-bottom: 20px; appearance: none; background-color: white; }
        .student-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .stu-btn { padding: 12px 5px; border-radius: 12px; border: 1px solid #e2e8f0; background: white; text-align: center; cursor: pointer; transition: 0.2s; min-height: 60px; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .stu-btn.selected { border: 2px solid var(--primary); background: #e7f3ff; }
        .stu-btn.done { background: #f0fff4; border-color: #9ae6b4; color: #276749; cursor: default; }
        .stu-btn small { font-size: 10px; margin-top: 2px; }
        #foodSection { display: none; border-top: 2px dashed #eee; margin-top: 20px; padding-top: 20px; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .food-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
        .food-btn { padding: 18px; border-radius: 15px; border: none; background: var(--primary); color: white; font-size: 16px; font-weight: bold; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .btn-footer { display: flex; justify-content: space-between; margin-top: 30px; }
        .btn-minor { background: none; border: none; color: #a0aec0; text-decoration: underline; cursor: pointer; font-size: 13px; }
        #adminPanel { display: none; background: #f8f9fa; padding: 15px; border-radius: 15px; margin-top: 15px; border: 1px solid #ddd; }
        .week-config-row { margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px solid #eee; }
        .week-config-row b { display: block; margin-bottom: 5px; color: var(--primary); }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h2 style="text-align:center; margin-top:0;">🍱 班級雲端點餐</h2>
        <div class="info-box">
            <div class="day-label" id="dateDisplay">載入中...</div>
        </div>
        
        <select id="classSelect" onchange="renderStudents()">
            <option value="">-- 請選擇班級 --</option>
        </select>

        <div id="studentGrid" class="student-grid"></div>

        <div id="foodSection">
            <label id="foodTitle" style="display:block; margin-bottom:15px; font-weight:bold; color:var(--primary); text-align:center;"></label>
            <div id="foodOptions" class="food-grid"></div>
            <button onclick="cancelSelect()" style="width:100%; background:none; border:none; color:#999; margin-top:15px;">✕ 取消選擇</button>
        </div>

        <div class="btn-footer">
            <button class="btn-minor" onclick="toggleAdmin()">⚙️ 設定名單與菜單</button>
            <button class="btn-minor" onclick="exportToExcel()">📥 下載報表</button>
        </div>

        <div id="adminPanel">
            <h3>系統管理員設定</h3>
            <label>修改登入密碼：</label>
            <input type="text" id="adminPwdConfig" style="width:100%; padding:8px; margin-bottom:15px; border-radius:5px; border:1px solid #ccc;">
            <hr>
            <h4>每週菜單設定</h4>
            <div id="menuEditor"></div>
            <hr>
            <label>學生名單 (格式：班級,姓名)</label>
            <textarea id="inputStudentList" style="width:100%; height:100px; border-radius:8px; border:1px solid #ccc; padding:10px;"></textarea>
            <button onclick="saveAllSettings()" style="width:100%; padding:12px; background:#444; color:white; border:none; border-radius:10px; margin-top:10px; font-weight:bold;">💾 保存設定</button>
        </div>
    </div>
</div>

<script>
    var scriptUrl = "https://script.google.com/macros/s/AKfycbwnqViI90bPvItzpm7XiEzDLHa3J1uBbS77FDU4HKoxlCh6WDUFMz_yUTF4TNgwiyt-Tg/exec";

    // 密碼與資料初始化
    var adminPassword = localStorage.getItem('cls_admin_pwd') || "1234"; // 預設密碼 1234
    var defaultWeeklyMenu = {
        1: [{n:"套餐A",p:100}, {n:"套餐B",p:100}, {n:"套餐C",p:100}],
        2: [{n:"套餐A",p:100}, {n:"套餐B",p:100}, {n:"套餐C",p:100}],
        3: [{n:"套餐A",p:100}, {n:"套餐B",p:100}, {n:"套餐C",p:100}],
        4: [{n:"套餐A",p:100}, {n:"套餐B",p:100}, {n:"套餐C",p:100}],
        5: [{n:"套餐A",p:100}, {n:"套餐B",p:100}, {n:"套餐C",p:100}]
    };

    var weeklyMenu = JSON.parse(localStorage.getItem('cls_weekly_menu')) || defaultWeeklyMenu;
    var savedStudents = JSON.parse(localStorage.getItem('cls_students')) || [];
    var historyLog = JSON.parse(localStorage.getItem('cls_history')) || [];
    var currentStu = null;

    window.onload = function() {
        var d = new Date();
        var days = ["日","一","二","三","四","五","六"];
        document.getElementById('dateDisplay').innerText = `📅 ${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} (週${days[d.getDay()]})`;
        
        var classes = [...new Set(savedStudents.map(s => s.className))];
        var sel = document.getElementById('classSelect');
        classes.forEach(c => { var opt = new Option(c, c); sel.add(opt); });

        initAdminUI();
    };

    function toggleAdmin() {
        var p = document.getElementById('adminPanel');
        if (p.style.display !== 'block') {
            var input = prompt("請輸入管理員密碼：");
            if (input === adminPassword) {
                p.style.display = 'block';
                p.scrollIntoView({ behavior: 'smooth' });
            } else if (input !== null) {
                alert("密碼錯誤！");
            }
        } else {
            p.style.display = 'none';
        }
    }

    function saveAllSettings() {
        // 儲存新密碼
        var newPwd = document.getElementById('adminPwdConfig').value;
        if(newPwd) {
            adminPassword = newPwd;
            localStorage.setItem('cls_admin_pwd', newPwd);
        }

        // 儲存菜單
        for(var i=1; i<=5; i++) {
            for(var j=0; j<3; j++) {
                weeklyMenu[i][j] = {
                    n: document.getElementById(`m_n_${i}_${j}`).value,
                    p: parseInt(document.getElementById(`m_p_${i}_${j}`).value) || 0
                };
            }
        }
        localStorage.setItem('cls_weekly_menu', JSON.stringify(weeklyMenu));
        
        // 儲存名單
        var raw = document.getElementById('inputStudentList').value;
        savedStudents = raw.split('\n').filter(l => l.includes(',')).map(l => {
            var p = l.split(',');
            return { className: p[0].trim(), name: p[1].trim() };
        });
        localStorage.setItem('cls_students', JSON.stringify(savedStudents));
        
        alert("所有設定已安全儲存！");
        location.reload();
    }

    // --- 其他邏輯保持不變 ---
    function renderStudents() {
        var cls = document.getElementById('classSelect').value;
        var grid = document.getElementById('studentGrid');
        grid.innerHTML = '';
        document.getElementById('foodSection').style.display = 'none';
        if(!cls) return;
        savedStudents.filter(s => s.className === cls).forEach(stu => {
            var order = historyLog.find(h => h.name === stu.name && h.cls === stu.className);
            var div = document.createElement('div');
            div.className = 'stu-btn' + (order ? ' done' : '');
            div.innerHTML = `<b>${stu.name}</b><small>${order ? order.item : '尚未點餐'}</small>`;
            if(!order) div.onclick = function() { selectStudent(stu.name, div); };
            grid.appendChild(div);
        });
    }

    function selectStudent(name, el) {
        currentStu = name;
        document.querySelectorAll('.stu-btn').forEach(b => b.classList.remove('selected'));
        el.classList.add('selected');
        var day = new Date().getDay();
        if(day === 0 || day === 6) { alert("週末不供餐！"); return; }
        document.getElementById('foodTitle').innerText = `為 ${name} 選餐：`;
        var opts = document.getElementById('foodOptions');
        opts.innerHTML = '';
        weeklyMenu[day].forEach(food => {
            var btn = document.createElement('button');
            btn.className = 'food-btn';
            btn.innerHTML = `<span>${food.n}</span><span>$${food.p}</span>`;
            btn.onclick = function() { submitOrder(food); };
            opts.appendChild(btn);
        });
        document.getElementById('foodSection').style.display = 'block';
    }

    function submitOrder(food) {
        var cls = document.getElementById('classSelect').value;
        var dateStr = new Date().toLocaleDateString();
        historyLog.push({ date: dateStr, cls: cls, name: currentStu, item: food.n, price: food.p });
        localStorage.setItem('cls_history', JSON.stringify(historyLog));
        document.getElementById('foodSection').style.display = 'none';
        renderStudents();
        var params = new URLSearchParams({ date: dateStr, cls: cls, name: currentStu, item: food.n, price: food.p });
        fetch(scriptUrl + "?" + params.toString(), { method: 'POST', mode: 'no-cors' });
    }

    function cancelSelect() {
        document.getElementById('foodSection').style.display = 'none';
        document.querySelectorAll('.stu-btn').forEach(b => b.classList.remove('selected'));
    }

    function initAdminUI() {
        var html = '';
        var days = ["","一","二","三","四","五"];
        for(var i=1; i<=5; i++) {
            html += `<div class="week-config-row"><b>星期${days[i]}</b>`;
            for(var j=0; j<3; j++) {
                var valN = weeklyMenu[i][j] ? weeklyMenu[i][j].n : "";
                var valP = weeklyMenu[i][j] ? weeklyMenu[i][j].p : "";
                html += `<div style="display:flex; gap:5px; margin-bottom:5px;">
                    <input type="text" id="m_n_${i}_${j}" value="${valN}" placeholder="餐點" style="flex:2; padding:5px; border-radius:5px; border:1px solid #ccc;">
                    <input type="number" id="m_p_${i}_${j}" value="${valP}" placeholder="價格" style="flex:1; padding:5px; border-radius:5px; border:1px solid #ccc;">
                </div>`;
            }
            html += `</div>`;
        }
        document.getElementById('menuEditor').innerHTML = html;
        document.getElementById('inputStudentList').value = savedStudents.map(s => s.className + "," + s.name).join('\n');
        document.getElementById('adminPwdConfig').value = adminPassword;
    }

    function exportToExcel() {
        var data = [["日期", "班級", "姓名", "餐點", "金額"]];
        historyLog.forEach(o => data.push([o.date, o.cls, o.name, o.item, o.price]));
        var ws = XLSX.utils.aoa_to_sheet(data);
        var wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "點餐記錄");
        XLSX.writeFile(wb, "點餐報表.xlsx");
    }
</script>
</body>
</html>
