<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>全校雲端點餐系統</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root { --primary: #007bff; --success: #28a745; --danger: #dc3545; --bg: #f4f7f9; }
        * { touch-action: manipulation; box-sizing: border-box; }
        body { font-family: -apple-system, system-ui, sans-serif; background-color: var(--bg); margin: 0; padding: 15px; color: #333; }
        .container { width: 100%; max-width: 600px; margin: 0 auto; }
        .card { background: white; padding: 20px; border-radius: 20px; box-shadow: 0 8px 24px rgba(0,0,0,0.08); margin-bottom: 20px; }
        .info-box { text-align: center; background: #e9ecef; padding: 12px; border-radius: 15px; margin-bottom: 10px; border: 1px solid #dee2e6; font-weight: bold; }
        .search-box { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #ddd; margin-bottom: 15px; font-size: 16px; border: 2px solid #edf2f7; }
        select { width: 100%; padding: 15px; border: 2px solid #edf2f7; border-radius: 12px; font-size: 16px; margin-bottom: 15px; appearance: none; background-color: white; cursor: pointer; }
        .student-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .stu-btn { padding: 12px 5px; border-radius: 12px; border: 1px solid #e2e8f0; background: white; text-align: center; cursor: pointer; transition: 0.2s; min-height: 60px; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .stu-btn.selected { border: 2px solid var(--primary); background: #e7f3ff; }
        .stu-btn.done { background: #f0fff4; border-color: #9ae6b4; color: #276749; }
        .stu-btn b { font-size: 15px; }
        .stu-btn small { font-size: 10px; margin-top: 2px; }
        #foodSection { display: none; border-top: 2px dashed #eee; margin-top: 20px; padding-top: 20px; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .food-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
        .food-btn { padding: 18px; border-radius: 15px; border: none; background: var(--primary); color: white; font-size: 16px; font-weight: bold; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .btn-footer { display: flex; justify-content: center; margin-top: 30px; }
        .btn-minor { background: #eee; border: none; color: #666; padding: 10px 20px; border-radius: 10px; cursor: pointer; font-size: 13px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h2 style="text-align:center; margin-top:0;">🍱 全校點餐系統</h2>
        <div class="info-box"><div id="dateDisplay">載入中...</div></div>
        
        <select id="classSelect" onchange="renderStudents()">
            <option value="">-- 請選擇年級或老師 --</option>
        </select>

        <input type="text" id="nameSearch" class="search-box" placeholder="🔍 輸入姓名快速找人..." oninput="renderStudents()">

        <div id="studentGrid" class="student-grid"></div>

        <div id="foodSection">
            <label id="foodTitle" style="display:block; margin-bottom:15px; font-weight:bold; color:var(--primary); text-align:center;"></label>
            <div id="foodOptions" class="food-grid"></div>
            <button onclick="submitOrder({n:'不訂餐', p:0})" class="food-btn" style="background:white; color:var(--danger); border:2px solid var(--danger); margin-top:10px;">🚫 今日不訂餐</button>
            <button onclick="cancelSelect()" style="width:100%; background:none; border:none; color:#999; margin-top:15px; cursor:pointer;">✕ 取消選擇</button>
        </div>

        <div class="btn-footer">
            <button class="btn-minor" onclick="exportToExcel()">📥 下載今日報表 (Excel)</button>
        </div>
    </div>
</div>

<script>
    // 你的 Google Apps Script 網址
    var scriptUrl = "https://script.google.com/macros/s/AKfycbzGFxtO24X6qwoOntCRVPNsjNUw3c2CEuAXemkGLILAFOWePd8XI1Ze1HUDDeTyLac/exec";

    // 固定名單
    var students = [
        {className:"老師",name:"張"},{className:"老師",name:"江"},{className:"老師",name:"瑜"},{className:"老師",name:"美"},{className:"老師",name:"華"},{className:"老師",name:"Vivian"},{className:"老師",name:"范"},
        {className:"國中",name:"昊謙"},{className:"國中",name:"建億"},
        {className:"其他",name:"嘉美"},
        {className:"一年級",name:"林鈺潔"},{className:"一年級",name:"趙偉哲"},{className:"一年級",name:"林袖駖"},{className:"一年級",name:"林宜靖"},{className:"一年級",name:"許思燦"},{className:"一年級",name:"許語芯"},{className:"一年級",name:"許心彤"},{className:"一年級",name:"雷喬勛"},{className:"一年級",name:"蘇薇心"},{className:"一年級",name:"吳妍熙"},{className:"一年級",name:"陳惠苡"},{className:"一年級",name:"陳佑陵"},{className:"一年級",name:"雷喬甯"},{className:"一年級",name:"吳謹彤"},{className:"一年級",name:"許愷峻"},
        {className:"二年級",name:"任彥輔"},{className:"二年級",name:"吳承恩"},{className:"二年級",name:"李依馨"},{className:"二年級",name:"阮妍芯"},{className:"二年級",name:"林子婼"},{className:"二年級",name:"林佩伶"},{className:"二年級",name:"林嘉豪"},{className:"二年級",name:"許昀紫"},{className:"二年級",name:"許芷媛"},{className:"二年級",name:"許倉源"},{className:"二年級",name:"許媛甄"},{className:"二年級",name:"許裴芸"},{className:"二年級",name:"程宥熙"},{className:"二年級",name:"鄭芯喬"},
        {className:"三年級",name:"才琇羽"},{className:"三年級",name:"王以琳"},{className:"三年級",name:"江昕瞳"},{className:"三年級",name:"吳晨晞"},{className:"三年級",name:"林宜薇"},{className:"三年級",name:"林欣毅"},{className:"三年級",name:"林恩睿"},{className:"三年級",name:"林翊城"},{className:"三年級",name:"林樂"},{className:"三年級",name:"許阡函"},{className:"三年級",name:"許芷嫣"},{className:"三年級",name:"許峮銧"},{className:"三年級",name:"許峻瑋"},{className:"三年級",name:"黃筠婷"},{className:"三年級",name:"雷允揚"},{className:"三年級",name:"趙宥程"},
        {className:"四年級",name:"周安佑"},{className:"四年級",name:"林禾畯"},{className:"四年級",name:"林靖宸"},{className:"四年級",name:"姜彥辰"},{className:"四年級",name:"許思晨"},{className:"四年級",name:"許柏翔"},{className:"四年級",name:"許珉豪"},{className:"四年級",name:"許峮萌"},{className:"四年級",name:"許惟智"},{className:"四年級",name:"許喬愉"},{className:"四年級",name:"許詠鈞"},{className:"四年級",name:"許愷祐"},{className:"四年級",name:"許澤安"},{className:"四年級",name:"陳楷翔"},{className:"四年級",name:"游淨淳"},{className:"四年級",name:"羅顏俊"},
        {className:"五年級",name:"吳秉叡"},{className:"五年級",name:"林子祺"},{className:"五年級",name:"林安平"},{className:"五年級",name:"林芮安"},{className:"五年級",name:"林勁丞"},{className:"五年級",name:"林科延"},{className:"五年級",name:"林祐安"},{className:"五年級",name:"洪淮銨"},{className:"五年級",name:"許昕瑜"},{className:"五年級",name:"許雅鈊"},{className:"五年級",name:"許維琳"},{className:"五年級",name:"黃羽萱"},{className:"五年級",name:"鄭凱宏"},{className:"五年級",name:"謝文軒"},{className:"五年級",name:"蘇薇安"},
        {className:"六年級",name:"吳嘉怡"},{className:"六年級",name:"周苡婷"},{className:"六年級",name:"林辰鑫"},{className:"六年級",name:"林夏彤"},{className:"六年級",name:"林雅芃"},{className:"六年級",name:"許岒澴"},{className:"六年級",name:"許郡宜"},{className:"六年級",name:"許閔哲"},{className:"六年級",name:"黃宥心"},{className:"六年級",name:"雷棨鋐"},{className:"六年級",name:"謝文硯"}
    ];

    var menu = {
        1: [{n:"炒麵＋綜合湯",p:70}, {n:"滷肉飯＋綜合湯",p:70}, {n:"米糕＋綜合湯",p:70}],
        2: [{n:"餐盒",p:70}], // 修正點：補上閉合括號
        3: [{n:"滷肉飯",p:70}, {n:"乾關東煮",p:70}, {n:"湯關東煮",p:70}],
        4: [{n:"餐盒",p:70}, {n:"麵",p:70}, {n:"水餃",p:70}],
        5: [{n:"鍋燒麵",p:70}, {n:"肉醬麵",p:70}, {n:"蛋包飯",p:70}]
    };

    var historyLog = JSON.parse(localStorage.getItem('cls_history')) || [];
    var currentStu = null;
    var currentCls = "";

    window.onload = function() {
        var d = new Date();
        var days = ["日","一","二","三","四","五","六"];
        document.getElementById('dateDisplay').innerText = `📅 ${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} (週${days[d.getDay()]})`;
        
        var sel = document.getElementById('classSelect');
        var order = ["老師", "一年級", "二年級", "三年級", "四年級", "五年級", "六年級", "國中", "其他"];
        order.forEach(c => { sel.add(new Option(c, c)); });
    };

    function renderStudents() {
        var cls = document.getElementById('classSelect').value;
        var search = document.getElementById('nameSearch').value.trim();
        var grid = document.getElementById('studentGrid');
        grid.innerHTML = '';
        document.getElementById('foodSection').style.display = 'none';
        if(!cls && !search) return;

        students.filter(s => {
            return (!cls || s.className === cls) && (!search || s.name.toLowerCase().includes(search.toLowerCase()));
        }).forEach(stu => {
            var order = historyLog.find(h => h.name === stu.name && h.cls === stu.className);
            var div = document.createElement('div');
            div.className = 'stu-btn' + (order ? ' done' : '');
            div.innerHTML = `<b>${stu.name}</b><small>${order ? order.item : '點餐'}</small>`;
            div.onclick = function() {
                if(order) {
                    if(confirm(`取消「${stu.name}」的紀錄嗎？`)) {
                        historyLog = historyLog.filter(h => !(h.name === stu.name && h.cls === stu.className));
                        localStorage.setItem('cls_history', JSON.stringify(historyLog));
                        renderStudents();
                    }
                } else {
                    currentStu = stu.name; currentCls = stu.className;
                    showFoodMenu(div);
                }
            };
            grid.appendChild(div);
        });
    }

    function showFoodMenu(el) {
        document.querySelectorAll('.stu-btn').forEach(b => b.classList.remove('selected'));
        el.classList.add('selected');
        var day = new Date().getDay();
        if(day === 0 || day === 6) { alert("週末不供餐"); return; }
        document.getElementById('foodTitle').innerText = `${currentStu} (${currentCls})`;
        var opts = document.getElementById('foodOptions');
        opts.innerHTML = '';
        menu[day].forEach(food => {
            var btn = document.createElement('button');
            btn.className = 'food-btn';
            btn.innerHTML = `<span>${food.n}</span><span>$${food.p}</span>`;
            btn.onclick = function() { submitOrder(food); };
            opts.appendChild(btn);
        });
        document.getElementById('foodSection').style.display = 'block';
    }

    function submitOrder(food) {
        var d = new Date();
        var dateStr = `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`;
        
        // 更新本地紀錄
        historyLog.push({ date: dateStr, cls: currentCls, name: currentStu, item: food.n, price: food.p });
        localStorage.setItem('cls_history', JSON.stringify(historyLog));
        
        document.getElementById('foodSection').style.display = 'none';
        renderStudents();

        // 傳送到 Apps Script
        var formData = new URLSearchParams({
            date: dateStr,
            cls: currentCls,
            name: currentStu,
            item: food.n,
            price: food.p
        });

        fetch(scriptUrl, {
            method: 'POST',
            mode: 'no-cors',
            body: formData
        }).then(() => {
            console.log("Success");
        }).catch(err => {
            alert("同步失敗，請檢查網路！");
        });
    }

    function cancelSelect() { document.getElementById('foodSection').style.display = 'none'; }

    function exportToExcel() {
        var data = [["日期", "分類", "姓名", "餐點", "金額"]];
        historyLog.forEach(o => data.push([o.date, o.cls, o.name, o.item, o.price]));
        var ws = XLSX.utils.aoa_to_sheet(data);
        var wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "報表");
        XLSX.writeFile(wb, "點餐報表_" + new Date().toLocaleDateString() + ".xlsx");
    }
</script>
</body>
</html>
